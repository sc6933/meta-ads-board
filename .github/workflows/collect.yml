name: 메타 광고 수집

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,5,9 * * *'   # UTC 01/05/09 = KST 10:00 / 14:00 / 18:00 (GitHub cron 은 수~수십 분 늦을 수 있음)

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04  # 26.04 는 Playwright 1.60 미지원
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.60.0
      - run: playwright install chromium --with-deps
      - run: python meta_ads.py
      - name: 커밋 (GitHub Pages 자동 반영)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta_ads.json
          git diff --staged --quiet && exit 0
          git commit -m "data: 메타 광고 갱신 ${{ github.run_id }}"
          git pull --rebase && git push
